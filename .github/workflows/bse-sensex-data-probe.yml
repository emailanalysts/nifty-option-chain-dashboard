name: BSE SENSEX Option Chain Probe

on:
  workflow_dispatch:
    inputs:
      expiry:
        description: "Expiry exactly as shown on BSE (e.g. 22 Oct 2026)"
        required: true
        default: "22 Oct 2026"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Probe BSE option chain (read-only)
        env:
          BSE_EXPIRY: ${{ inputs.expiry }}
        run: python bse_sensex_probe.py
