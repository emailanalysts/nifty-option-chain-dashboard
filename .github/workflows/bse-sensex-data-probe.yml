name: BSE SENSEX Data Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe public BSE endpoints
        run: python bse_sensex_probe.py
