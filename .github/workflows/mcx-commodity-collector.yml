name: MCX Commodity Collector

on:
  workflow_dispatch:
  schedule:
    # UTC schedule: every 10 minutes, 09:00-23:50 IST, Monday-Friday.
    - cron: "30,40,50 3 * * 1-5"
    - cron: "*/10 4-17 * * 1-5"
    - cron: "0,10,20 18 * * 1-5"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Collect MCX commodity snapshots
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python mcx_collector.py
