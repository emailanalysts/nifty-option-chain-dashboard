name: MCX Commodity Collector

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test MCX endpoint without inserting rows into Supabase"
        required: true
        type: boolean
        default: true
  schedule:
    # Every 10 minutes; collector itself enforces 09:00-23:59 IST, weekdays.
    - cron: "*/10 3-18 * * 1-5"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright psycopg2-binary
      - run: python -m playwright install --with-deps chromium
      - name: Collect or test MCX commodity snapshots
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MCX_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only && '1' || '0' }}
        run: python mcx_collector.py
