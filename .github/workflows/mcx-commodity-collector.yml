name: MCX Commodity Collector
on:
  workflow_dispatch:
  schedule:
    # UTC schedule, every 10 minutes during weekday commodity-session window.
    # 03:30 UTC = 09:00 IST; last run 18:20 UTC = 23:50 IST.
    - cron: "*/10 3-18 * * 1-5"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright psycopg2-binary
      - run: python -m playwright install --with-deps chromium
      - name: Collect MCX commodity snapshots
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python mcx_collector.py
