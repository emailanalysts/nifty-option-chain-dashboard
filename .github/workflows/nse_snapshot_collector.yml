name: NSE Option Chain Snapshot Collector

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports scheduled workflow intervals down to 5 minutes.
    # The collector itself enforces the 09:15–15:30 IST market window.
    - cron: "*/5 9-15 * * 1-5"
      timezone: "Asia/Kolkata"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect NSE snapshots
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python collector.py
