```yaml
name: BSE SENSEX Browser Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture official BSE option-chain response
        env:
          BSE_EXPIRY: '22 Oct 2026'
        run: python bse_sensex_browser_probe.py

      # Upload diagnostic files even if the Python probe fails.
      - name: Upload BSE diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-sensex-diagnostics
          path: bse_diagnostics/
          if-no-files-found: warn
          retention-days: 7

      # Preserve the original JSON artifact upload as well.
      - name: Upload captured JSON (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensex-browser-probe
          path: sensex_browser_probe.json
          if-no-files-found: ignore
          retention-days: 3
```
