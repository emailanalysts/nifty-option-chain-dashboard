name: Futures 5M Collector

on:
  schedule:
    # 09:15, 09:20, ..., 09:55 IST
    - cron: "45-59/5 3 * * 1-5"

    # 10:00 to 14:55 IST
    - cron: "*/5 4-9 * * 1-5"

    # Final collection at 15:00 IST
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"

  workflow_dispatch:

jobs:
  collect-futures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary

      - name: Run Futures Collector
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python futures_collector.py
