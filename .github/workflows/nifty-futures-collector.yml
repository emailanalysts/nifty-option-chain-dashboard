name: NIFTY Futures Collector

on:
  schedule:
    # GitHub Actions schedules use UTC. These times cover 09:15–15:40 IST.
    - cron: '45,50,55 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0,5,10 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nifty-futures-collector
  cancel-in-progress: false

jobs:
  collect-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect futures snapshots
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python futures_collector.py
