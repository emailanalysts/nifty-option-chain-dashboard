name: SENSEX FYERS Collector

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum interval.
    # These UTC windows cover approximately 09:15-15:30 IST on weekdays.
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0,5,10 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: sensex-fyers-collector
  cancel-in-progress: false

jobs:
  collect-sensex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Refresh FYERS access token
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_APP_SECRET: ${{ secrets.FYERS_APP_SECRET }}
          FYERS_REFRESH_TOKEN: ${{ secrets.FYERS_REFRESH_TOKEN }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
        run: python refresh_fyers_token.py

      - name: Collect SENSEX snapshots from FYERS
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_ACCESS_TOKEN: ${{ env.FYERS_ACCESS_TOKEN }}
        run: python sensex_fyers_collector.py
