name: BSE SENSEX Library Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install library
        run: python -m pip install --upgrade pip indiaopt

      - name: Test SENSEX option chain
        run: python bse_sensex_library_probe.py
